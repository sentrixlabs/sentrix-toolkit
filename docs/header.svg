<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Sentrix Toolkit</title>
  <desc id="d">Open, read-only security and compliance tools by Sentrix. A console runs checks and reports their status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060D1C"/>
      <stop offset="0.55" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#0A2A3A"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#67E8F9"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
      <animate attributeName="x1" values="-1;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0E7490" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0E7490" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E3A5F" opacity="0.55"/>
    </pattern>
    <clipPath id="term"><rect x="690" y="48" width="470" height="264" rx="14"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .row  { opacity: 0; animation: run 12s ease-out infinite both; }
    .r1 { animation-delay: 0.4s; } .r2 { animation-delay: 1.2s; } .r3 { animation-delay: 2.0s; }
    .r4 { animation-delay: 2.8s; } .r5 { animation-delay: 3.6s; } .r6 { animation-delay: 4.4s; }
    .r7 { animation-delay: 5.4s; }
    @keyframes run { 0% { opacity: 0; transform: translateX(-6px); } 4% { opacity: 1; transform: none; } 88% { opacity: 1; } 94%, 100% { opacity: 0; } }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .scanline { animation: sweep 4s linear infinite; }
    @keyframes sweep { from { transform: translateY(-80px); } to { transform: translateY(300px); } }
    @media (prefers-reduced-motion: reduce) {
      .row { animation: none; opacity: 1; }
      .pulse, .cursor, .scanline { animation: none; }
      .scanline { display: none; }
    }
  </style>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#dots)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <rect x="0" y="356" width="1200" height="4" fill="#0E7490"/>
  <rect x="0" y="356" width="220" height="4" fill="#67E8F9"/>

  <!-- Left -->
  <g class="sans">
    <text x="64" y="96" class="mono" font-size="14" letter-spacing="3" fill="#67E8F9">SENTRIXLABS · OPEN SOURCE</text>
    <text x="62" y="160" font-size="58" font-weight="700" fill="url(#word)">Sentrix Toolkit</text>
    <text x="64" y="200" font-size="20" fill="#CBD5E1">Open, read-only security and compliance tools.</text>
    <text x="64" y="228" font-size="15" fill="#64748B">Outils ouverts de sécurité et de conformité.</text>

    <g font-size="14" font-weight="600" class="mono">
      <rect x="64" y="262" width="108" height="32" rx="16" fill="#0E7490" fill-opacity="0.18" stroke="#0E7490"/>
      <text x="118" y="283" text-anchor="middle" fill="#A5F3FC">analyzers</text>
      <rect x="182" y="262" width="100" height="32" rx="16" fill="#0E7490" fill-opacity="0.18" stroke="#0E7490"/>
      <text x="232" y="283" text-anchor="middle" fill="#A5F3FC">checkers</text>
      <rect x="292" y="262" width="76" height="32" rx="16" fill="#0E7490" fill-opacity="0.18" stroke="#0E7490"/>
      <text x="330" y="283" text-anchor="middle" fill="#A5F3FC">tools</text>
      <rect x="378" y="262" width="98" height="32" rx="16" fill="#0E7490" fill-opacity="0.18" stroke="#0E7490"/>
      <text x="427" y="283" text-anchor="middle" fill="#A5F3FC">mappings</text>
    </g>
  </g>

  <!-- Console -->
  <rect x="690" y="48" width="470" height="264" rx="14" fill="#050B17" fill-opacity="0.85" stroke="#1E3A5F"/>
  <g clip-path="url(#term)">
    <rect x="690" y="48" width="470" height="36" fill="#0B1730"/>
    <circle cx="712" cy="66" r="5" fill="#C1121F"/>
    <circle cx="730" cy="66" r="5" fill="#F59E0B"/>
    <circle cx="748" cy="66" r="5" fill="#10B981"/>
    <text x="925" y="71" text-anchor="middle" class="mono" font-size="13" fill="#64748B">sentrix-toolkit · checks</text>
    <rect class="scanline" x="690" y="84" width="470" height="80" fill="url(#scan)"/>

    <g class="mono" font-size="15">
      <g class="row r1"><circle class="pulse" cx="716" cy="112" r="5" fill="#10B981"/><text x="732" y="117" fill="#CBD5E1">SPF record</text><text x="1136" y="117" text-anchor="end" fill="#10B981">PASS</text></g>
      <g class="row r2"><circle class="pulse" cx="716" cy="142" r="5" fill="#10B981"/><text x="732" y="147" fill="#CBD5E1">DKIM selector</text><text x="1136" y="147" text-anchor="end" fill="#10B981">PASS</text></g>
      <g class="row r3"><circle class="pulse" cx="716" cy="172" r="5" fill="#F59E0B"/><text x="732" y="177" fill="#CBD5E1">DMARC policy</text><text x="1060" y="177" text-anchor="end" fill="#64748B">p=none</text><text x="1136" y="177" text-anchor="end" fill="#F59E0B">WARN</text></g>
      <g class="row r4"><circle class="pulse" cx="716" cy="202" r="5" fill="#10B981"/><text x="732" y="207" fill="#CBD5E1">TLS version</text><text x="1060" y="207" text-anchor="end" fill="#64748B">1.3</text><text x="1136" y="207" text-anchor="end" fill="#10B981">PASS</text></g>
      <g class="row r5"><circle class="pulse" cx="716" cy="232" r="5" fill="#10B981"/><text x="732" y="237" fill="#CBD5E1">HSTS header</text><text x="1136" y="237" text-anchor="end" fill="#10B981">PASS</text></g>
      <g class="row r6"><circle class="pulse" cx="716" cy="262" r="5" fill="#10B981"/><text x="732" y="267" fill="#CBD5E1">security.txt</text><text x="1136" y="267" text-anchor="end" fill="#10B981">PASS</text></g>
      <g class="row r7" font-size="13"><text x="712" y="298" fill="#67E8F9">6 checks · 5 pass · 1 warn · read-only</text><rect class="cursor" x="992" y="286" width="8" height="15" fill="#67E8F9"/></g>
    </g>
  </g>
</svg>
